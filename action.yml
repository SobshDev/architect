name: Architect
description: Check a pull request against the repository's architecture contract in .architect/.
author: Gabriel Brument
branding:
  icon: layers
  color: blue
inputs:
  base:
    description: Git ref to compare against. Defaults to the pull request's base branch (origin/<base>).
    required: false
    default: ""
  sarif:
    description: Where to write the SARIF report.
    required: false
    default: architect.sarif
  upload-sarif:
    description: Upload the SARIF report to GitHub code scanning. Needs the security-events write permission.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14
    - name: Install Architect
      shell: bash
      working-directory: ${{ github.action_path }}
      run: bun install --frozen-lockfile --production
    - name: Run architect ci
      shell: bash
      env:
        ARCHITECT_ACTION_PATH: ${{ github.action_path }}
        ARCHITECT_BASE: ${{ inputs.base }}
        ARCHITECT_SARIF: ${{ inputs.sarif }}
      run: |
        base="$ARCHITECT_BASE"
        if [ -z "$base" ] && [ -n "${GITHUB_BASE_REF:-}" ]; then base="origin/$GITHUB_BASE_REF"; fi
        if [ -z "$base" ]; then
          echo "::error::Set the base input, or run on pull_request events."
          exit 2
        fi
        bun "$ARCHITECT_ACTION_PATH/src/cli/main.ts" ci --base "$base" --sarif "$ARCHITECT_SARIF"
    - name: Upload SARIF
      if: always() && inputs.upload-sarif == 'true' && hashFiles(inputs.sarif) != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif }}
        category: architect
