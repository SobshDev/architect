    url: https://github.com/donnemartin/system-design-primer
    sha: ae9bbd7b02d90b9866215de185217d33f39ab733
    license: CC-BY-4.0
    relation: cc-by
    use: Adapt text only, in packs/cc-by. Skip the figures credited to third parties.
