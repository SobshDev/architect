# Reference corpus used while writing knowledge cards.
# `bun run corpus:fetch` clones each repo into data/repos/<dir> at the pinned commit.
# `relation` is the strongest relation a card may claim to the source:
#   adapted  - the license (MIT, CC0) allows adapting text into MIT cards
#   cc-by    - adaptations must live in packs/cc-by with attribution
#   see-also - link only; cards contain no text derived from the source
version: 1
repos:
